apiVersion: apps/v1
kind: Deployment

metadata:
  name: login-app

spec:

  replicas: 2

  selector:
    matchLabels:
      app: login-app

  template:

    metadata:
      labels:
        app: login-app

    spec:
      imagePullSecrets:
        - name: ecr-secret
      
      containers:

      - name: login-app

        image: 943246945615.dkr.ecr.ap-south-1.amazonaws.com/login-app:latest 

        imagePullPolicy: Always   

        ports:

        - containerPort: 3000

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"