<!DOCTYPE html>
<html>

<head>

    <title>User Registration</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="left">

        <img src="images/login.jpg" alt="login">

    </div>

    <div class="right">

        <h2>Create Account</h2>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
